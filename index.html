<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wanderlog — Your Travel Journal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header and Navigation -->
  <header class="site-header">

    <div class="wordmark">Wanderlog</div>

    <nav aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#destinations">Destinations</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>

  </header>

    <!-- Your Destinations -->
    <section class="destinations" id="destinations" aria-labelledby="destinations-heading">

      <h2 id="destinations-heading">Your Destinations</h2>

      <div class="trip-grid" id="trip-grid"></div>

    </section>
  <!-- Main Content -->
  <main>

    <!-- Homepage Hero -->
    <section class="hero" id="home">

      <h1>Every trip has a story. Keep yours.</h1>

      <p>
        Wanderlog is your travel journal — log the places you go,
        the routes you take, and the moments you don't want to forget.
      </p>

      <a href="#" class="cta-button">Start your journal</a>

    </section>

    <!-- Add Trip Form -->
    <section class="add-trip" id="add-trip" aria-labelledby="add-trip-heading">

      <h2 id="add-trip-heading">Add a Trip</h2>

      <form id="trip-form" novalidate>
        <div class="form-field">
          <label for="trip-title">Trip title</label>
          <input type="text" id="trip-title" name="title" required>
        </div>

        <div class="form-field">
          <label for="trip-destination">Destination</label>
          <input type="text" id="trip-destination" name="destination" required>
        </div>

        <div class="form-field">
          <label for="trip-date">Date</label>
          <input type="date" id="trip-date" name="date" required>
        </div>

        <div class="form-field">
          <label for="trip-notes">Notes</label>
          <textarea id="trip-notes" name="notes" rows="5" required></textarea>
        </div>

        <p class="form-message" id="form-message" role="alert"></p>
        <button type="submit" class="submit-button">Save trip</button>
      </form>

    </section>

  </main>


  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Wanderlog. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
